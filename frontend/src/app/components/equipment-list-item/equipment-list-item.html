<div class="flex items-center bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm hover:shadow-md hover:border-purple-300 transition cursor-pointer">
    <div class="w-28 h-22 shrink-0 bg-gray-100 flex items-center justify-center overflow-hidden">
        <img src="https://placehold.co/112x88/7b1fa2/ffffff?text=MAN" alt="Manifold Subsea 4 Vias" class="w-full h-full object-cover" />
    </div>
    <div class="flex-1 px-4 py-3 min-w-0">
        <div class="flex items-center gap-2 mb-1 flex-wrap">
            <h2 class="text-base font-bold text-gray-900 m-0 truncate">{{equipment().name}}</h2>
            <span class="shrink-0 bg-purple-100 text-purple-800 text-xs font-bold uppercase tracking-wide px-2 py-0.5 rounded">{{equipment().tipo}}</span>
            <span class="text-xs text-gray-400 font-mono">{{equipment().id}}</span>
        </div>
        <p class="text-sm text-gray-500 m-0 truncate">{{equipment().description}}</p>
    </div>
    <div class="flex flex-col items-end gap-2 px-5 py-3 shrink-0 border-l border-gray-100 min-w-36">
        <span class="text-base font-bold text-gray-900">{{equipment().price}}</span>
        <span class="flex items-center gap-1.5 text-xs text-gray-500">
            <span class="w-2 h-2 rounded-full bg-amber-500 shrink-0"></span>
            {{equipment().qtd}}
        </span>
        <div class="flex gap-1">
            <button class="flex items-center justify-center w-8 h-8 rounded-md border border-gray-200 text-gray-400 bg-transparent cursor-pointer hover:border-blue-400 hover:text-blue-700 hover:bg-blue-50 transition">
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
            <button class="flex items-center justify-center w-8 h-8 rounded-md border border-gray-200 text-gray-400 bg-transparent cursor-pointer hover:border-blue-400 hover:text-blue-700 hover:bg-blue-50 transition">
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
        </div>
    </div>
</div>
