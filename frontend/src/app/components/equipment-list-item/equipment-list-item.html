<div class="flex items-center bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm hover:shadow-md hover:border-purple-300 transition cursor-pointer">
    <div class="w-28 h-22 shrink-0 bg-gray-100 flex items-center justify-center overflow-hidden">
        <img src="https://placehold.co/112x88/7b1fa2/ffffff?text=MAN" alt="Manifold Subsea 4 Vias" class="w-full h-full object-cover" />
    </div>
    <div class="flex-1 px-4 py-3 min-w-0">
        <div class="flex items-center gap-2 mb-1 flex-wrap">
            <h2 class="text-base font-bold text-gray-900 m-0 truncate">{{equipment().name}}</h2>
            <span class="shrink-0 bg-purple-100 text-purple-800 text-xs font-bold uppercase tracking-wide px-2 py-0.5 rounded">{{equipment().type}}</span>
            <span class="text-xs text-gray-400 font-mono">{{equipment().id}}</span>
        </div>
        <p class="text-sm text-gray-500 m-0 truncate">{{equipment().description}}</p>
    </div>
    <div class="flex flex-col items-end gap-2 px-5 py-3 shrink-0 border-l border-gray-100 min-w-36">
        <span class="text-base font-bold text-gray-900">R$ {{equipment().price}}</span>
        <span class="flex items-center gap-1.5 text-xs text-gray-500">
            <span class="w-2 h-2 rounded-full bg-amber-500 shrink-0"></span>
            {{equipment().quantity}} units
        </span>
    </div>
</div>
