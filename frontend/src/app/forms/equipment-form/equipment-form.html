<form [formGroup]="form" class="w-full space-y-4">

  <!-- Header -->
  <div class="border-b pb-3 mb-4">
    <h2 class="text-lg font-semibold text-gray-800">
      Equipment Form
    </h2>
    <p class="text-sm text-gray-500">
      Create, update or delete equipment
    </p>
  </div>

  <!-- ID -->
  <div class="space-y-1">
    <label class="text-sm font-medium text-gray-700">ID</label>

    <input
      type="text"
      formControlName="id"
      class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm
             focus:outline-none focus:ring-2 focus:ring-blue-500"
      placeholder="Enter equipment ID"
    />

    <p class="text-xs text-red-500"
       *ngIf="form.controls.id.touched && form.controls.id.invalid">
      ID is required
    </p>
  </div>

  <!-- Name -->
  <div class="space-y-1">
    <label class="text-sm font-medium text-gray-700">Name</label>

    <input
      type="text"
      formControlName="name"
      class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm
             focus:outline-none focus:ring-2 focus:ring-blue-500"
      placeholder="Equipment name"
    />

    <p class="text-xs text-red-500"
       *ngIf="form.controls.name.touched && form.controls.name.invalid">
      Name is required
    </p>
  </div>

  <!-- Description -->
  <div class="space-y-1">
    <label class="text-sm font-medium text-gray-700">Description</label>

    <textarea
      formControlName="description"
      rows="3"
      class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm
             focus:outline-none focus:ring-2 focus:ring-blue-500"
      placeholder="Description"
    ></textarea>
  </div>

  <!-- Type -->
  <div class="space-y-1">
    <label class="text-sm font-medium text-gray-700">Type</label>

    <input
      type="text"
      formControlName="type"
      class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm
             focus:outline-none focus:ring-2 focus:ring-blue-500"
      placeholder="Type"
    />
  </div>

  <!-- Price + Quantity -->
  <div class="grid grid-cols-2 gap-3">

    <div class="space-y-1">
      <label class="text-sm font-medium text-gray-700">Price</label>

      <input
        type="number"
        formControlName="price"
        class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm
               focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="0"
      />
    </div>

    <div class="space-y-1">
      <label class="text-sm font-medium text-gray-700">Quantity</label>

      <input
        type="number"
        formControlName="quantity"
        class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm
               focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="0"
      />
    </div>

  </div>

  <!-- Actions -->
  <div class="flex justify-end gap-2 pt-4 border-t mt-4">

    <button
      type="button"
      (click)="createData()"
      class="px-4 py-2 text-sm rounded-md bg-green-600 text-white
             hover:bg-green-700 transition"
    >
      Create
    </button>

    <button
      type="button"
      (click)="updateData()"
      class="px-4 py-2 text-sm rounded-md bg-blue-600 text-white
             hover:bg-blue-700 transition"
    >
      Update
    </button>

    <button
      type="button"
      (click)="deleteData()"
      class="px-4 py-2 text-sm rounded-md bg-red-600 text-white
             hover:bg-red-700 transition"
    >
      Delete
    </button>

  </div>

</form>
